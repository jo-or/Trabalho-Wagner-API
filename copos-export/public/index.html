<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vidraria Export · Back-office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Vidraria<span>Export</span></div>
    <nav>
      <a href="#cadastro" class="active">Cadastrar copo</a>
      <a href="#catalogo">Catálogo</a>
      <a href="#simulador">Simulador de exportação</a>
    </nav>
    <p class="sidebar-note">Preço de venda = custo base × 2<br>(lucro de 100%)</p>
  </aside>

  <main>
    <header class="page-head">
      <h1>Painel de exportação</h1>
      <div class="stats">
        <div class="stat"><span id="statTotal">–</span><small>modelos cadastrados</small></div>
        <div class="stat"><span id="statMedio">–</span><small>custo médio de produção</small></div>
      </div>
    </header>

    <!-- Seção 1 -->
    <section id="cadastro" class="card">
      <h2>Cadastrar copo</h2>
      <form id="formProduto" class="grid-form">
        <label>Nome do modelo
          <input name="nome_modelo" required minlength="2" placeholder="Ex.: Copo Long Drink Cristal">
        </label>
        <label>Capacidade (ml)
          <input name="capacidade_ml" type="number" min="1" step="1" required placeholder="350">
        </label>
        <label>Custo de produção (R$)
          <input name="custo_producao_base" type="number" min="0" step="0.01" required placeholder="4,80">
        </label>
        <button type="submit" class="btn">Salvar copo</button>
      </form>
    </section>

    <!-- Seção 2 -->
    <section id="catalogo" class="card">
      <h2>Catálogo</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Modelo</th><th class="num">Capacidade</th><th class="num">Custo base</th><th class="num">Preço de venda</th></tr></thead>
          <tbody id="tabelaProdutos"><tr><td colspan="5" class="empty">Carregando…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- Seção 3 -->
    <section id="simulador" class="card">
      <h2>Simulador de exportação</h2>
      <form id="formSimulador" class="grid-form">
        <label>Copo
          <select id="selectProduto" name="id" required><option value="">Selecione…</option></select>
        </label>
        <label>País / moeda de destino
          <select name="moeda_destino" required>
            <option value="USD">Estados Unidos (USD)</option>
            <option value="EUR">Zona do Euro (EUR)</option>
            <option value="GBP">Reino Unido (GBP)</option>
            <option value="JPY">Japão (JPY)</option>
            <option value="ARS">Argentina (ARS)</option>
          </select>
        </label>
        <button type="submit" class="btn" id="btnSimular">Calcular preço de exportação</button>
      </form>

      <div id="resultado" class="resultado" hidden aria-live="polite"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="js/app.js"></script>
</body>
</html>
